<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kimia TCG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/lucide-react@latest/dist/umd/lucide-react.js"></script>
</head>
<body class="bg-slate-900 text-white flex items-center justify-center min-h-screen">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { FlaskConical, Atom, Flame } = lucideReact;

        // Versi Mudah untuk Test Hosting
        function App() {
            return (
                <div className="text-center p-10 bg-slate-800 rounded-2xl border-2 border-blue-500 shadow-2xl max-w-lg mx-auto animate-bounce-in">
                    <div className="flex justify-center mb-4">
                        <FlaskConical size={64} className="text-blue-400" />
                    </div>
                    <h1 className="text-4xl font-bold mb-4 text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-500">
                        Game Berjaya Online!
                    </h1>
                    <p className="text-slate-300 mb-6">
                        Tahniah! Hosting GitHub Pages anda berfungsi dengan baik.
                    </p>
                    <div className="p-4 bg-slate-900 rounded-lg text-sm text-green-400 font-mono">
                        Status: Connected<br/>
                        System: React + Tailwind<br/>
                        Hosting: GitHub Pages
                    </div>
                    <p className="mt-6 text-xs text-slate-500">
                        Sekarang anda boleh gantikan kod ini dengan kod game penuh anda.
                    </p>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
